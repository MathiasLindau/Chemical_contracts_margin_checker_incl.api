
name: Daily Market Price Update

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install openpyxl

      - name: Fetch market prices
        run: python data/scripts/create_api_price.py

      - name: Calculate contract prices
        run: python data/scripts/calculate_contract_price.py

      - name: Commit updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market/api_price.csv
          git add data/market/contract_price.csv
          git add data/market/contract_price_history.csv

          if ! git diff --cached --quiet; then
            git commit -m "Update daily market prices"
            git push
          fi
